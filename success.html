<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 10px;
        }
        .container {
            border: 2px solid #00ff41;
            padding: 20px; /* Padding kam kar di */
            border-radius: 10px;
            width: 90%; /* Screen width ke hisaab se */
            max-width: 400px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }
        h1 {
            font-size: 1.5rem; /* Heading size chota kiya */
            text-transform: uppercase;
        }
        p {
            font-size: 0.9rem; /* Text size chota kiya */
            margin: 10px 0;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #000;
            background-color: #00ff41;
            padding: 8px 16px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ORDER CONFIRMED! 🎉</h1>
        <p>Your order has been placed successfully.</p>
        <p>Our team will contact you shortly for verification.</p>
        <a href="index.html">Return to Home</a>

</html>
