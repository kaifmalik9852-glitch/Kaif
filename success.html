<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed</title>
    <style>
    .confirmation-box {
        padding: 40px 20px; /* Thoda padding badhaya */
        margin: 20px;
        border: 2px solid #00ff66;
        border-radius: 15px;
        text-align: center;
        background: #0a0a0a;
    }

    h1.order-title {
        font-size: 2.2rem; /* Title ko bada kiya */
        color: #00ff66;
        margin-bottom: 20px;
        line-height: 1.2;
    }

    p.order-msg {
        font-size: 1.1rem; /* Message ko padhne layak bada kiya */
        color: #ffffff;
        margin-bottom: 30px;
        word-wrap: break-word; /* Text screen se bahar nahi jayega */
        max-width: 100%;
    }
</style>


    
</head>
<body>
    <!-- HTML structure -->
<div class="confirmation-box">
    <h1 class="order-title">ORDER CONFIRMED! 🎉</h1>
    <p class="order-msg">
        Your order has been placed successfully.<br>
        Our team will contact you shortly for verification.
    </p>
    <a href="index.html" class="btn">confirm</a>
</div>
</body>
</html>
