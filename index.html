<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP-01 ESP8266 WiFi Module - Cyber Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, sans-serif; }
        body { background-color: #05080c; color: #00ff66; overflow-x: hidden; line-height: 1.6; }
        
        /* Modal Style - Form ko hide karne ke liye */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 12, 0.95);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #090f16;
            border: 2px solid #00ff66;
            width: 100%;
            max-width: 440px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
            position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 15px; color: #ff3366; cursor: pointer; font-weight: bold; }

        /* Baki CSS wahi hai jo aapne di thi */
        .btn { padding: 16px; cursor: pointer; border-radius: 6px; font-weight: 900; text-transform: uppercase; border: none; width: 100%; }
        .btn-online { background: #00ff66; color: #05080c; }
        .btn-cod { background: transparent; color: #ffffff; border: 2px solid #ffffff; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #00ff66; font-size: 0.8rem; }
        .input-group input { width: 100%; padding: 10px; background: #05080c; border: 1px solid #00ff66; color: #fff; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container" style="padding-top: 100px; text-align: center; max-width: 500px; margin: auto;">
        <h1>ESP8266 ESP-01</h1>
        <p>Ultra-compact wireless communication module.</p>
        
        <div class="btn-container" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <a href="#" class="btn btn-online">⚡ BUY NOW</a>
            <button onclick="openModal()" class="btn btn-cod">📦 CASH ON DELIVERY (COD)</button>
        </div>
    </div>

    <div id="codModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">X CLOSE</span>
            <h3>SHIPPING INFORMATION</h3>
            <form id="my-form" action="https://formspree.io/f/xaqrqlyo" method="POST">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="input-group">
                    <label>Address</label>
                    <input type="text" name="address" required>
                </div>
                <button type="submit" class="btn btn-online">PLACE ORDER NOW</button>
            </form>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('codModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('codModal').style.display = 'none'; }
        
        var form = document.getElementById("my-form");
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            var data = new FormData(form);
            fetch(form.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) { window.location.href = "success.html"; }
                else { alert("Error! Try again."); }
            });
        });
    </script>
</body>
</html>
